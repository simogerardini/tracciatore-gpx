<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracciatore">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Tracciatore GPX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --paper:#F6F7F4; --surface:#FFFFFF; --ink:#1E2528; --muted:#5D6B70; --line:#D5DBD8;
  --signal:#C8102E; --polder:#2F5D73; --start:#1F7A4D; --warn:#B86200; --ok:#1F7A4D;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#15191B; --surface:#1C2124; --ink:#E8ECEA; --muted:#9AA7AB; --line:#2C3437;
    --signal:#E5484D; --polder:#6FA3BC; --start:#3FB67A; --warn:#E59A3C; --ok:#3FB67A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 Overpass,"Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:400px 1fr;height:100%}
.panel{overflow-y:auto;border-right:1px solid var(--line);padding:22px 20px 40px;background:var(--paper)}
#map{height:100%;min-height:320px}
header h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;line-height:1.1}
header p{margin:0 0 18px;color:var(--muted);font-size:14px}
h2{font-size:17px;font-weight:800;margin:22px 0 10px}
h3{font-size:15px;font-weight:800;margin:18px 0 8px}
.hint{margin:-4px 0 12px;color:var(--muted);font-size:13.5px}
label.field{display:block;margin:10px 0;font-size:13.5px;color:var(--muted)}
label.field select,label.field input{display:block;width:100%;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--polder);outline-offset:1px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0;padding:0}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg label{position:relative;text-align:center;padding:9px 4px;cursor:pointer;background:var(--surface);border-right:1px solid var(--line);font-weight:600}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked){background:var(--ink);color:var(--paper)}
.seg label:has(input:focus-visible){outline:2px solid var(--polder);outline-offset:-3px}
.seg.small label{padding:6px 4px;font-size:13.5px}
.loopbox{margin-top:12px;padding:12px 12px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.loopbox label.field{margin:8px 0}
.loopbox input,.loopbox select{background:var(--paper)}
#points{list-style:none;margin:10px 0 0;padding:0;position:relative}
#points::before{content:"";position:absolute;left:15px;top:20px;bottom:20px;border-left:2px dashed var(--line)}
.pt{display:grid;grid-template-columns:32px 1fr auto;gap:8px;padding:8px 0;position:relative}
.badge{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-weight:800;background:var(--surface);border:2.5px solid var(--polder);color:var(--polder);margin-top:18px;z-index:1}
.pt.start .badge{border-color:var(--start);color:var(--start)}
.pt.end .badge{border-color:var(--signal);color:var(--signal)}
.pt.active .badge{background:var(--polder);color:#fff}
.pt-body label{font-size:13px;color:var(--muted);font-weight:600}
.pt-body .row{display:flex;gap:4px;margin-top:2px}
.pt-body input{flex:1}
.coords{font-size:12.5px;color:var(--muted);margin-top:3px}
.tools{display:flex;flex-direction:column;gap:2px;margin-top:18px}
button.icon{width:30px;height:30px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;line-height:1}
button.icon:disabled{opacity:.35;cursor:default}
button.icon[aria-pressed=true]{background:var(--polder);border-color:var(--polder);color:#fff}
.tools button.icon{width:26px;height:24px;font-size:12px}
.results{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:220px;overflow:auto}
.results li+li{border-top:1px solid var(--line)}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 9px;font-size:13px;cursor:pointer}
.results button:hover{background:var(--paper)}
.results .muted{padding:7px 9px;font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;font-size:14px}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff;font-weight:800;padding:10px 16px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:800}
.btn:disabled{opacity:.45;cursor:default}
#status{margin-top:16px;font-size:14px;min-height:1.4em}
#status.err{color:var(--signal);font-weight:600}
#status.busy{color:var(--muted)}
.kv{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.kv div{border-top:2px solid var(--ink);padding-top:4px}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:0;font-size:19px;font-weight:800}
.elev{margin:14px 0 0}
.elev svg{width:100%;height:90px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.elev polyline{fill:none;stroke:var(--signal);stroke-width:1.6;vector-effect:non-scaling-stroke}
.elev figcaption{font-size:12.5px;color:var(--muted);margin-top:3px}
.issues{margin:0;padding-left:18px;color:var(--warn);font-size:14px}
.issues li+li{margin-top:4px}
p.ok{margin:0;color:var(--ok);font-size:14px;font-weight:600}
.bars{list-style:none;margin:0;padding:0}
.bars li{margin:7px 0}
.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.bar-l span:last-child{color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--polder)}
.names{margin:0;padding-left:20px;font-size:14px}
.names span{color:var(--muted)}
.leaflet-container.picking{cursor:crosshair}
.pin{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#fff;border:3px solid var(--polder);color:var(--polder);font:800 14px Overpass,system-ui,sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.pin.start{border-color:var(--start);color:var(--start)}
.pin.end{border-color:var(--signal);color:var(--signal)}
.sheetbar{display:none}

/* ---------- smartphone: mappa a schermo intero + pannello a scomparsa ---------- */
@media (max-width:820px){
  html,body{overflow:hidden}
  .app{display:block;height:100%}
  #map{position:fixed;inset:0;height:100%;min-height:0}
  .leaflet-top{top:env(safe-area-inset-top,0px)}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;border-right:0;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);
    padding:0 16px calc(28px + env(safe-area-inset-bottom,0px));transition:height .25s ease;
    height:50vh;height:50dvh;overscroll-behavior:contain}
  .panel[data-sheet=min]{height:calc(70px + env(safe-area-inset-bottom,0px));overflow:hidden}
  .panel[data-sheet=max]{height:calc(100vh - 60px);height:calc(100dvh - 60px - env(safe-area-inset-top,0px))}
  .sheetbar{display:flex;flex-direction:column;align-items:stretch;position:sticky;top:0;z-index:2;width:calc(100% + 32px);
    margin:0 -16px;padding:8px 16px 10px;border:0;border-bottom:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left}
  .grip{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--line);margin-bottom:8px}
  .sb-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .sb-title{font-weight:800;font-size:18px}
  #summary{color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
  header{display:none}
  input[type=text],input[type=number],select{font-size:16px;padding:10px}
  button.icon{width:40px;height:40px}
  .tools{margin-top:22px}
  .tools button.icon{width:34px;height:32px}
  .badge{margin-top:22px}
  .btn{padding:10px 14px}
  .pin{width:32px;height:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel" data-sheet="mid" aria-label="Pannello di pianificazione">
    <button type="button" class="sheetbar" id="sheetToggle" aria-expanded="true" aria-controls="panelBody">
      <span class="grip" aria-hidden="true"></span>
      <span class="sb-row"><span class="sb-title">Tracciatore GPX</span><span id="summary">Nessun percorso</span></span>
    </button>
    <div id="panelBody">
    <header>
      <h1>Tracciatore GPX</h1>
      <p>Percorsi calcolati su strade e ciclabili reali di OpenStreetMap, pronti per Garmin, Wahoo, Komoot e OsmAnd.</p>
    </header>

    <h2>Mezzo e preferenze</h2>
    <fieldset class="seg">
      <legend>Mezzo</legend>
      <label><input type="radio" name="mode" value="bike" checked>Bici</label>
      <label><input type="radio" name="mode" value="foot">A piedi</label>
      <label><input type="radio" name="mode" value="car">Auto</label>
    </fieldset>
    <label class="field">Preferenza percorso
      <select id="profile"></select>
    </label>
    <label class="field">Motore di calcolo
      <select id="engine">
        <option value="brouter">BRouter: preferenze, quote e superfici</option>
        <option value="osrm">OSRM: nomi delle strade, senza quote</option>
      </select>
    </label>

    <h2>Tipo di giro</h2>
    <fieldset class="seg">
      <legend>Tipo di giro</legend>
      <label><input type="radio" name="kind" value="ab" checked>Da A a B</label>
      <label><input type="radio" name="kind" value="loop">Ad anello</label>
    </fieldset>

    <div class="loopbox" id="loopBox" hidden>
      <fieldset class="seg small">
        <legend>Obiettivo</legend>
        <label><input type="radio" name="target" value="dist" checked>Distanza</label>
        <label><input type="radio" name="target" value="time">Tempo</label>
      </fieldset>
      <div class="grid2">
        <label class="field" id="fDist">Distanza (km)
          <input type="number" id="loopKm" min="2" max="300" step="1" value="40" inputmode="decimal">
        </label>
        <label class="field" id="fTime" hidden>Tempo (minuti)
          <input type="number" id="loopMin" min="10" max="900" step="5" value="120" inputmode="numeric">
        </label>
        <label class="field" id="fSpeed" hidden>Media (km/h)
          <input type="number" id="loopSpeed" min="2" max="120" step="0.5" value="18" inputmode="decimal">
        </label>
        <label class="field">Direzione
          <select id="loopDir"><option value="cw">Orario</option><option value="ccw">Antiorario</option></select>
        </label>
        <label class="field">Forma
          <select id="loopShape"><option value="3">Compatta, 3 passaggi</option><option value="4" selected>Rotonda, 4 passaggi</option><option value="5">Ampia, 5 passaggi</option></select>
        </label>
      </div>
      <div class="btns" style="margin-bottom:10px">
        <button class="btn dark" id="loopGo" type="button">Genera anello</button>
        <button class="btn" id="loopAlt" type="button">Altra variante</button>
      </div>
    </div>

    <h2>Punti</h2>
    <p class="hint" id="pointsHint"></p>
    <div class="btns" style="margin-top:0"><button class="btn" id="locate" type="button">Usa la mia posizione</button></div>
    <ol id="points"></ol>
    <div class="btns">
      <button class="btn" id="add" type="button">Aggiungi tappa</button>
      <button class="btn" id="swap" type="button">Inverti direzione</button>
      <button class="btn" id="reset" type="button">Ricomincia</button>
    </div>

    <h2>Esporta</h2>
    <label class="field">Nome del percorso
      <input type="text" id="name" value="Percorso in bici">
    </label>
    <div class="btns">
      <button class="btn primary" id="dl" type="button" disabled>Scarica GPX</button>
      <a class="btn" id="verify" target="_blank" rel="noopener" hidden>Verifica su BRouter-Web</a>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <section id="stats" hidden></section>
    </div>
  </aside>
  <div id="map" aria-label="Mappa"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const GAP = 150, SNAP = 150;
const PROFILES = {
  bike: [["trekking","Equilibrata: ciclabili e strade tranquille"],["safety","Massima priorità alle piste ciclabili"],["fastbike","Veloce, anche su strada"],["shortest","Più breve"]],
  foot: [["hiking-beta","Escursionismo, preferisce sentieri"],["shortest","Più breve"]],
  car:  [["car-fast","Più veloce"],["car-eco","Più economica"]]
};
const SPEED = { bike:{ trekking:18, safety:16, fastbike:25, shortest:18 }, foot:{ "hiking-beta":4.5, shortest:5 }, car:{ "car-fast":55, "car-eco":45 } };
const OSRM = { bike:["routed-bike","bike"], foot:["routed-foot","foot"], car:["routed-car","driving"] };
const GPX_TYPE = { bike:"cycling", foot:"hiking", car:"driving" };
const MODE_NAME = { bike:"in bici", foot:"a piedi", car:"in auto" };

let uid = 0;
const newPt = () => ({ id: ++uid, lat: null, lon: null, label: "" });
const st = { kind:"ab", points:[newPt(), newPt()], mode:"bike", profile:"trekking", engine:"brouter",
             active:null, route:null, loopBearing:null, speedEdited:false, nameEdited:false };
const isLoop = () => st.kind === "loop";
const touch = matchMedia("(pointer: coarse)").matches;
const mobile = matchMedia("(max-width: 820px)");

/* ---------- utilità ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = p => `${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}`;
const short = n => n.split(",").slice(0, 3).join(",").trim();
const km = (m, d = 1) => (m / 1000).toFixed(d).replace(".", ",");
function roleOf(i, n) {
  if (isLoop()) return i === 0 ? "Partenza e arrivo" : `Passaggio ${i}`;
  return i === 0 ? "Partenza" : i === n - 1 ? "Arrivo" : `Tappa ${i}`;
}
function pinClass(i, n) { return i === 0 ? "start" : (!isLoop() && i === n - 1) ? "end" : "via"; }
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const R = 6371008.8, rad = x => x * Math.PI / 180, deg = x => x * 180 / Math.PI, M_PER_DEG = rad(1) * R;
function hav(a, b) {
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function distToSeg(p, a, b) {
  const k = Math.cos(rad(p.lat));
  const ax = (a.lon - p.lon) * k, ay = a.lat - p.lat, bx = (b.lon - p.lon) * k, by = b.lat - p.lat;
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  const t = L2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0;
  return Math.hypot(ax + t * dx, ay + t * dy) * M_PER_DEG;
}
function offset(lat, lon, d, brg) {          // punto a distanza d (m) e rotta brg (rad) da lat/lon
  const dr = d / R, la = rad(lat), lo = rad(lon);
  const la2 = Math.asin(Math.sin(la) * Math.cos(dr) + Math.cos(la) * Math.sin(dr) * Math.cos(brg));
  const lo2 = lo + Math.atan2(Math.sin(brg) * Math.sin(dr) * Math.cos(la), Math.cos(dr) - Math.sin(la) * Math.sin(la2));
  return { lat: deg(la2), lon: ((deg(lo2) + 540) % 360) - 180 };
}
const pathLen = c => { let d = 0; for (let i = 1; i < c.length; i++) d += hav(c[i - 1], c[i]); return d; };
function parseCoords(s) {
  const t = s.replace(/°/g, " ").trim();
  const m = t.match(/^(-?\d{1,3}(?:\.\d+)?)\s*([NSns])?\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*([EWOewo])?$/);
  if (!m) return null;
  let lat = +m[1], lon = +m[3];
  if (m[2] && /s/i.test(m[2])) lat = -Math.abs(lat);
  if (m[4] && /[wo]/i.test(m[4])) lon = -Math.abs(lon);
  return Math.abs(lat) <= 90 && Math.abs(lon) <= 180 ? [lat, lon] : null;
}
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
function setStatus(msg, kind = "") { const el = $("#status"); el.textContent = msg; el.className = kind; }

/* ---------- pannello mobile ---------- */
const panel = $(".panel");
function setSheet(s) {
  if (!mobile.matches) return;
  panel.dataset.sheet = s;
  $("#sheetToggle").setAttribute("aria-expanded", String(s !== "min"));
  setTimeout(() => map.invalidateSize(), 280);
}
$("#sheetToggle").addEventListener("click", () =>
  setSheet({ min: "mid", mid: "max", max: "min" }[panel.dataset.sheet] || "mid"));

/* ---------- mappa ---------- */
const map = L.map("map", { zoomControl: !touch }).setView([52.16, 4.49], 12);
const cyclosm = L.tileLayer("https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png",
  { subdomains: "abc", maxZoom: 20, attribution: "© OpenStreetMap contributors, CyclOSM" }).addTo(map);
const voyager = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
  { subdomains: "abcd", maxZoom: 20, attribution: "© OpenStreetMap contributors © CARTO" });
L.control.layers({ "CyclOSM, ciclabili in evidenza": cyclosm, "Carto Voyager": voyager }).addTo(map);
const markers = new Map();
const gapLayer = L.layerGroup().addTo(map);
let casing = null, line = null;

function fitRoute() {
  if (!line) return;
  const bottom = mobile.matches ? panel.offsetHeight + 16 : 30;
  map.fitBounds(line.getBounds(), { paddingTopLeft: [30, 30], paddingBottomRight: [30, bottom] });
}

map.on("click", e => {
  let p = st.points.find(q => q.id === st.active) || st.points.find(q => q.lat == null);
  if (!p) { p = newPt(); if (isLoop()) st.points.push(p); else st.points.splice(st.points.length - 1, 0, p); }
  st.active = null;
  map.getContainer().classList.remove("picking");
  setPoint(p, e.latlng.lat, e.latlng.lng, null);
  setSheet("mid");
});

function renderMarkers() {
  markers.forEach(m => map.removeLayer(m)); markers.clear();
  const n = st.points.length;
  st.points.forEach((p, i) => {
    if (p.lat == null) return;
    const m = L.marker([p.lat, p.lon], {
      draggable: true, title: roleOf(i, n), keyboard: true,
      icon: L.divIcon({ className: "", html: `<span class="pin ${pinClass(i, n)}">${i + 1}</span>`, iconSize: [32, 32], iconAnchor: [16, 16] })
    }).addTo(map);
    m.on("dragend", e => { const ll = e.target.getLatLng(); setPoint(p, ll.lat, ll.lng, null); });
    markers.set(p.id, m);
  });
}

/* ---------- lista punti ---------- */
function renderPoints() {
  $("#pointsHint").textContent = isLoop()
    ? "Imposta la partenza, poi genera l’anello. I passaggi generati si possono trascinare o aggiungere a mano."
    : "Scrivi un luogo o “lat, lon” e premi Invio, oppure tocca la mappa. Trascina i segnaposto per spostarli.";
  const ol = $("#points"); ol.innerHTML = "";
  const n = st.points.length, loop = isLoop();
  st.points.forEach((p, i) => {
    const li = document.createElement("li");
    li.className = `pt ${pinClass(i, n)}` + (st.active === p.id ? " active" : "");
    const upOff = i === 0 || (loop && i === 1), downOff = i === n - 1 || (loop && i === 0);
    const delOff = loop ? i === 0 : n <= 2;
    li.innerHTML = `
      <span class="badge" aria-hidden="true">${i + 1}</span>
      <div class="pt-body">
        <label for="in${p.id}">${roleOf(i, n)}</label>
        <div class="row">
          <input type="text" id="in${p.id}" value="${esc(p.label)}" placeholder="Luogo, indirizzo o lat, lon" autocomplete="off" enterkeyhint="search">
          <button type="button" class="icon" data-act="search" title="Cerca" aria-label="Cerca">⌕</button>
          <button type="button" class="icon" data-act="pick" title="Scegli sulla mappa" aria-label="Scegli sulla mappa" aria-pressed="${st.active === p.id}">◎</button>
        </div>
        <div class="coords">${p.lat != null ? fmt(p) : "Posizione non impostata"}</div>
        <ul class="results" hidden></ul>
      </div>
      <div class="tools">
        <button type="button" class="icon" data-act="up" ${upOff ? "disabled" : ""} title="Sposta su" aria-label="Sposta su">↑</button>
        <button type="button" class="icon" data-act="down" ${downOff ? "disabled" : ""} title="Sposta giù" aria-label="Sposta giù">↓</button>
        <button type="button" class="icon" data-act="del" ${delOff ? "disabled" : ""} title="Rimuovi" aria-label="Rimuovi">✕</button>
      </div>`;
    li.addEventListener("click", e => {
      const b = e.target.closest("button[data-act]"); if (!b) return;
      const idx = st.points.indexOf(p), act = b.dataset.act;
      if (act === "search") search(p, li);
      else if (act === "pick") {
        st.active = st.active === p.id ? null : p.id;
        map.getContainer().classList.toggle("picking", !!st.active);
        renderPoints();
        setStatus(st.active ? `Tocca la mappa per posizionare: ${roleOf(idx, n)}.` : "");
        if (st.active) setSheet("min");
      }
      else if (act === "up") { [st.points[idx - 1], st.points[idx]] = [st.points[idx], st.points[idx - 1]]; changed(); }
      else if (act === "down") { [st.points[idx + 1], st.points[idx]] = [st.points[idx], st.points[idx + 1]]; changed(); }
      else if (act === "del") { st.points.splice(idx, 1); changed(); }
    });
    const inp = li.querySelector("input");
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); inp.blur(); search(p, li); } });
    inp.addEventListener("input", () => { p.label = inp.value; });
    ol.append(li);
  });
}
function changed() { renderPoints(); renderMarkers(); scheduleRoute(); }

function setPoint(p, lat, lon, label) {
  p.lat = lat; p.lon = lon; p.label = label ?? fmt(p);
  changed();
  if (label == null) reverse(p);
}

async function search(p, li) {
  const q = li.querySelector("input").value.trim(); if (!q) return;
  const c = parseCoords(q);
  if (c) { setPoint(p, c[0], c[1], q); map.setView(c, Math.max(map.getZoom(), 15)); return; }
  const box = li.querySelector(".results"); box.hidden = false;
  box.innerHTML = `<li class="muted">Ricerca in corso…</li>`;
  const b = map.getBounds();
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=it&q=${encodeURIComponent(q)}&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}`;
  try {
    const r = await fetch(url); if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const js = await r.json();
    if (!js.length) { box.innerHTML = `<li class="muted">Nessun risultato. Prova con nome e città, oppure inserisci le coordinate.</li>`; return; }
    box.innerHTML = "";
    js.forEach(x => {
      const it = document.createElement("li"), btn = document.createElement("button");
      btn.type = "button"; btn.textContent = x.display_name;
      btn.onclick = () => { setPoint(p, +x.lat, +x.lon, short(x.display_name)); map.setView([+x.lat, +x.lon], 15); };
      it.append(btn); box.append(it);
    });
  } catch (e) {
    box.innerHTML = `<li class="muted">Ricerca non riuscita (${esc(e.message)}).</li>`;
  }
}

async function reverse(p) {
  const placeholder = p.label;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=it&lat=${p.lat}&lon=${p.lon}`);
    if (!r.ok) return;
    const j = await r.json();
    if (j.display_name && p.label === placeholder) {
      p.label = short(j.display_name);
      const inp = document.getElementById("in" + p.id); if (inp) inp.value = p.label;
    }
  } catch { /* il nome è solo cosmetico */ }
}

/* ---------- routing ---------- */
let timer, seq = 0;
const routePoints = () => isLoop() ? [...st.points, st.points[0]] : st.points;
const ready = () => st.points.length >= 2 && st.points.every(p => p.lat != null);
function scheduleRoute() {
  clearTimeout(timer); updateVerify();
  if (!ready()) { seq++; st.route = null; drawRoute(); renderStats(); return; }
  timer = setTimeout(computeRoute, 350);
}
const fetchRoute = pts => st.engine === "brouter" ? viaBRouter(pts) : viaOSRM(pts);

async function computeRoute() {
  const my = ++seq, hadRoute = !!st.route;
  setStatus("Calcolo del percorso…", "busy");
  try {
    const res = await fetchRoute(routePoints());
    if (my !== seq) return;
    applyRoute(res, !hadRoute);
    setStatus(`Percorso calcolato con ${res.engine}.`);
  } catch (e) {
    if (my !== seq) return;
    st.route = null; drawRoute(); renderStats();
    setStatus(`${e.message} Controlla che i punti siano raggiungibili con questo mezzo, oppure cambia motore.`, "err");
  }
}
function applyRoute(res, fit) {
  if (res.coords.length < 2) throw new Error("Il motore ha restituito un percorso vuoto.");
  res.analysis = analyse(res.coords);
  res.breakdown = breakdown(res.messages, res.analysis.dist);
  st.route = res; drawRoute(); renderStats(); updateVerify();
  if (fit) fitRoute();
}

async function viaBRouter(pts) {
  const lonlats = pts.map(p => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join("|");
  const r = await fetch(`https://brouter.de/brouter?lonlats=${encodeURIComponent(lonlats)}&profile=${st.profile}&alternativeidx=0&format=geojson`);
  const txt = await r.text();
  if (!r.ok) throw new Error("BRouter: " + txt.trim().slice(0, 200));
  const f = JSON.parse(txt).features[0];
  return {
    engine: `BRouter, profilo ${st.profile}`,
    coords: f.geometry.coordinates.map(c => ({ lat: c[1], lon: c[0], ele: c.length > 2 ? c[2] : null })),
    messages: f.properties.messages || null,
    time: +f.properties["total-time"] || null,
    names: null
  };
}
async function viaOSRM(pts) {
  const [srv, prof] = OSRM[st.mode];
  const c = pts.map(p => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(";");
  const r = await fetch(`https://routing.openstreetmap.de/${srv}/route/v1/${prof}/${c}?overview=full&geometries=geojson&steps=true`);
  const j = await r.json();
  if (j.code !== "Ok") throw new Error("OSRM: " + (j.message || j.code));
  const rt = j.routes[0], names = {};
  rt.legs.forEach(l => l.steps.forEach(s => { const n = s.name || s.ref; if (n) names[n] = (names[n] || 0) + s.distance; }));
  return {
    engine: `OSRM, profilo ${prof}`,
    coords: rt.geometry.coordinates.map(c => ({ lat: c[1], lon: c[0], ele: null })),
    messages: null, time: rt.duration, names
  };
}

/* ---------- generatore di anelli ---------- */
/*
  Metodo: i passaggi stanno su una circonferenza che passa per la partenza, con il centro
  a distanza r nella direzione b0. Il raggio iniziale stima la tortuosità della rete
  (strada reale ≈ 1,3 volte il perimetro geometrico); poi si corregge r in proporzione
  all'errore misurato sulla traccia vera, fino a ±5% dall'obiettivo (max 6 tentativi).
  Un passaggio che cade fuori rete (acqua, aree chiuse) fa ruotare l'anello e riprovare.
*/
function loopVias(s, r, b0, n, cw) {
  const c = offset(s.lat, s.lon, r, b0), a0 = b0 + Math.PI, sg = cw ? 1 : -1;
  return Array.from({ length: n }, (_, k) => offset(c.lat, c.lon, r, a0 + sg * 2 * Math.PI * (k + 1) / (n + 1)));
}
function currentSpeed() { return +$("#loopSpeed").value || SPEED[st.mode][st.profile] || 18; }
function loopTarget() {
  const byTime = document.querySelector("input[name=target]:checked").value === "time";
  return byTime ? (+$("#loopMin").value / 60) * currentSpeed() * 1000 : +$("#loopKm").value * 1000;
}
let loopBusy = false;
async function generateLoop(newVariant) {
  if (loopBusy) return;
  const s = st.points[0];
  if (!s || s.lat == null) { setStatus("Imposta prima la partenza: cercala, toccala sulla mappa o usa la tua posizione.", "err"); return; }
  const target = loopTarget();
  if (!(target >= 1000)) { setStatus("Indica una distanza o un tempo validi.", "err"); return; }
  if (newVariant || st.loopBearing == null) st.loopBearing = Math.random() * 2 * Math.PI;
  const n = +$("#loopShape").value, cw = $("#loopDir").value === "cw";
  loopBusy = true; seq++; clearTimeout(timer);
  $("#loopGo").disabled = $("#loopAlt").disabled = true;
  let r = target / (2 * Math.PI * 1.3), b0 = st.loopBearing, best = null, fails = 0, tries = 0;
  try {
    while (tries < 6 && fails < 5) {
      setStatus(`Genero l’anello: tentativo ${tries + fails + 1}…`, "busy");
      const vias = loopVias(s, r, b0, n, cw);
      let res;
      try { res = await fetchRoute([s, ...vias, s]); }
      catch { fails++; b0 += 0.6; continue; }
      tries++;
      const d = pathLen(res.coords);
      if (!best || Math.abs(d - target) < Math.abs(best.d - target)) best = { vias, res, d, b0 };
      if (Math.abs(d - target) / target <= 0.05) break;
      r *= Math.max(0.5, Math.min(1.8, target / d));
    }
    if (!best) throw new Error("Non riesco a chiudere un anello da qui: prova “Altra variante” o sposta la partenza.");
    st.loopBearing = best.b0;
    st.points = [s, ...best.vias.map((v, k) => ({ id: ++uid, lat: v.lat, lon: v.lon, label: `Passaggio generato ${k + 1}` }))];
    seq++; renderPoints(); renderMarkers();
    applyRoute(best.res, true);
    if (!st.nameEdited) $("#name").value = `Anello ${MODE_NAME[st.mode]} ${km(best.d, 0)} km`;
    const err = (best.d - target) / target * 100;
    setStatus(`Anello di ${km(best.d)} km: obiettivo ${km(target)} km, scarto ${err >= 0 ? "+" : ""}${err.toFixed(0)}%. Trascina i passaggi per ritoccarlo.`);
  } catch (e) {
    setStatus(e.message, "err");
  } finally {
    loopBusy = false; $("#loopGo").disabled = $("#loopAlt").disabled = false;
  }
}

/* ---------- analisi ---------- */
function analyse(c) {
  let dist = 0, maxGap = 0, rep = 0; const gaps = [], cum = [0], seen = new Map();
  for (let i = 0; i < c.length; i++) {
    if (i) {
      const d = hav(c[i - 1], c[i]); dist += d; cum.push(dist);
      if (d > maxGap) maxGap = d;
      if (d > GAP) gaps.push({ i, d });
    }
    // tratti ripetuti: celle di ~25 m già visitate molto prima nella traccia
    const key = Math.round(c[i].lat * 4000) + ":" + Math.round(c[i].lon * 4000 * Math.cos(rad(c[i].lat)));
    const first = seen.get(key);
    if (first === undefined) seen.set(key, i);
    else if (i - first > 30 && i) rep += cum[i] - cum[i - 1];
  }
  const hasEle = c.every(p => p.ele != null);
  let up = 0, down = 0;
  if (hasEle) {
    let ref = c[0].ele;
    for (const p of c) {
      if (p.ele - ref >= 3) { up += p.ele - ref; ref = p.ele; }
      else if (ref - p.ele >= 3) { down += ref - p.ele; ref = p.ele; }
    }
  }
  const snaps = st.points.map(p => {
    let m = Infinity;
    for (let i = 1; i < c.length; i++) { const d = distToSeg(p, c[i - 1], c[i]); if (d < m) m = d; }
    return m;
  });
  return { dist, maxGap, gaps, cum, hasEle, up, down, snaps, rep };
}

function wayClass(t) {
  const h = t.highway || "";
  if (h === "cycleway" || (h === "path" && /designated/.test(t.bicycle || ""))) return "Pista ciclabile separata";
  if (t.cyclestreet === "yes" || t.bicycle_road === "yes") return "Strada ciclabile (fietsstraat)";
  if (/track|lane|opposite/.test([t.cycleway, t["cycleway:right"], t["cycleway:left"], t["cycleway:both"]].join(" "))) return "Strada con ciclabile o corsia";
  if (["residential", "living_street", "service"].includes(h)) return "Strada residenziale o di servizio";
  if (["unclassified", "tertiary", "tertiary_link"].includes(h)) return "Strada secondaria";
  if (/^(secondary|primary|trunk)/.test(h)) return "Strada principale";
  if (["path", "footway", "pedestrian", "steps", "bridleway"].includes(h)) return "Sentiero o area pedonale";
  if (h === "track") return "Carrareccia";
  if (t.route === "ferry") return "Traghetto";
  return h ? `Altro (${h})` : "Non classificato";
}
function surfClass(t) {
  const s = t.surface;
  if (!s) return "Non indicata in OSM";
  if (["asphalt", "paved"].includes(s)) return "Asfalto";
  if (["paving_stones", "sett", "bricks", "cobblestone", "unhewn_cobblestone"].includes(s)) return "Klinkers o pavé";
  if (s.startsWith("concrete")) return "Cemento";
  if (["compacted", "fine_gravel", "gravel", "pebblestone"].includes(s)) return "Sterrato compatto o ghiaia";
  if (["unpaved", "dirt", "ground", "earth", "grass", "sand", "mud", "woodchips"].includes(s)) return "Sterrato";
  if (["wood", "metal"].includes(s)) return "Legno o metallo (ponti)";
  return s;
}
function breakdown(msgs, total) {
  if (!msgs || msgs.length < 2) return null;
  const h = msgs[0], iD = h.indexOf("Distance"), iW = h.indexOf("WayTags");
  if (iD < 0 || iW < 0) return null;
  const rows = msgs.slice(1);
  let d = rows.map(r => +r[iD] || 0);
  if (d.reduce((s, v) => s + v, 0) > total * 1.5) d = d.map((v, i) => i ? v - d[i - 1] : v);
  const way = {}, surf = {};
  rows.forEach((r, i) => {
    const tags = Object.fromEntries(String(r[iW] || "").split(" ").filter(Boolean)
      .map(t => { const k = t.indexOf("="); return [t.slice(0, k), t.slice(k + 1)]; }));
    const w = wayClass(tags), s = surfClass(tags);
    way[w] = (way[w] || 0) + d[i]; surf[s] = (surf[s] || 0) + d[i];
  });
  return { way, surf };
}

/* ---------- output ---------- */
function drawRoute() {
  [casing, line].forEach(l => l && map.removeLayer(l)); casing = line = null;
  gapLayer.clearLayers();
  if (!st.route) return;
  const ll = st.route.coords.map(c => [c.lat, c.lon]);
  casing = L.polyline(ll, { color: "#fff", weight: 8, opacity: .9, interactive: false }).addTo(map);
  line = L.polyline(ll, { color: cssVar("--signal"), weight: 4.5, interactive: false }).addTo(map);
  st.route.analysis.gaps.forEach(g => {
    const p = st.route.coords[g.i];
    L.circleMarker([p.lat, p.lon], { radius: 7, color: cssVar("--warn"), weight: 2, fillOpacity: .15 })
      .bindTooltip(`${Math.round(g.d)} m dal punto precedente`).addTo(gapLayer);
  });
}

function bars(title, obj) {
  const tot = Object.values(obj).reduce((s, v) => s + v, 0) || 1;
  const rows = Object.entries(obj).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  return `<h3>${title}</h3><ul class="bars">${rows.map(([k, v]) => `
    <li><div class="bar-l"><span>${esc(k)}</span><span>${km(v)} km, ${Math.round(v / tot * 100)}%</span></div>
    <div class="bar"><i style="width:${(v / tot * 100).toFixed(1)}%"></i></div></li>`).join("")}</ul>`;
}
function elevation(c, a) {
  const W = 320, H = 90, es = c.map(p => p.ele);
  let mn = Infinity, mx = -Infinity; for (const e of es) { if (e < mn) mn = e; if (e > mx) mx = e; }
  const span = Math.max(mx - mn, 10), step = Math.max(1, Math.floor(c.length / 500)), pts = [];
  for (let i = 0; i < c.length; i += step)
    pts.push(`${(a.cum[i] / (a.dist || 1) * W).toFixed(1)},${(H - 6 - (es[i] - mn) / span * (H - 16)).toFixed(1)}`);
  return `<figure class="elev"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Profilo altimetrico"><polyline points="${pts.join(" ")}"/></svg>
    <figcaption>Quota tra ${Math.round(mn)} e ${Math.round(mx)} m (SRTM)</figcaption></figure>`;
}

function renderStats() {
  const box = $("#stats"); $("#dl").disabled = !st.route;
  if (!st.route) { box.hidden = true; box.innerHTML = ""; $("#summary").textContent = "Nessun percorso"; return; }
  const r = st.route, a = r.analysis, n = st.points.length;
  $("#summary").textContent = `${km(a.dist)} km` + (a.hasEle ? `, +${Math.round(a.up)} m` : "");
  const repPct = a.dist ? a.rep / a.dist * 100 : 0;
  let html = `<h2>Riepilogo</h2><dl class="kv">
    <div><dt>Distanza</dt><dd>${km(a.dist, 2)} km</dd></div>
    <div><dt>Dislivello</dt><dd>${a.hasEle ? `+${Math.round(a.up)} / −${Math.round(a.down)} m` : "n/d"}</dd></div>
    <div><dt>Tempo stimato</dt><dd>${r.time ? fmtTime(r.time) : "n/d"}</dd></div>
    <div><dt>Tratti ripetuti</dt><dd>${repPct < 1 ? "nessuno" : `${repPct.toFixed(0)}%`}</dd></div></dl>`;
  if (a.hasEle) html += elevation(r.coords, a);
  const issues = [];
  a.snaps.forEach((d, i) => { if (d > SNAP) issues.push(`${roleOf(i, n)} è a ${Math.round(d)} m dalla traccia: forse cade fuori dalla rete percorribile con questo mezzo.`); });
  if (a.gaps.length) issues.push(`${a.gaps.length} tratti con più di ${GAP} m tra punti consecutivi, cerchiati in arancio. Di solito sono rettilinei reali: controllali sulla mappa.`);
  if (isLoop() && repPct >= 15) issues.push(`Il ${repPct.toFixed(0)}% dell’anello ripassa sulla stessa strada: prova un’altra variante o una forma diversa.`);
  html += `<h3>Controllo traccia</h3>` + (issues.length
    ? `<ul class="issues">${issues.map(t => `<li>${t}</li>`).join("")}</ul>`
    : `<p class="ok">Nessun salto: distanza massima tra punti ${Math.round(a.maxGap)} m, tutti i punti agganciati alla rete entro ${SNAP} m.</p>`);
  if (r.breakdown) html += bars("Tipo di strada", r.breakdown.way) + bars("Superficie", r.breakdown.surf);
  if (r.names) {
    const top = Object.entries(r.names).sort((x, y) => y[1] - x[1]).slice(0, 12);
    if (top.length) html += `<h3>Strade principali percorse</h3><ol class="names">${top.map(([k, v]) => `<li>${esc(k)} <span>${km(v)} km</span></li>`).join("")}</ol>`;
  }
  box.innerHTML = html; box.hidden = false;
}

function updateVerify() {
  const a = $("#verify");
  if (!ready()) { a.hidden = true; return; }
  const lonlats = routePoints().map(p => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(";");
  const prof = st.engine === "brouter" ? st.profile : PROFILES[st.mode][0][0];
  const c = map.getCenter();
  a.href = `https://brouter.de/brouter-web/#map=${map.getZoom()}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}/standard&lonlats=${lonlats}&profile=${prof}`;
  a.hidden = false;
}

function buildGPX(name) {
  const r = st.route, n = st.points.length;
  const wpts = st.points.map((p, i) =>
    `  <wpt lat="${p.lat.toFixed(6)}" lon="${p.lon.toFixed(6)}">\n    <name>${esc(roleOf(i, n))}</name>\n    <desc>${esc(p.label)}</desc>\n  </wpt>`).join("\n");
  const trkpts = r.coords.map(c =>
    `      <trkpt lat="${c.lat.toFixed(6)}" lon="${c.lon.toFixed(6)}">${c.ele != null ? `<ele>${c.ele.toFixed(1)}</ele>` : ""}</trkpt>`).join("\n");
  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Tracciatore GPX (${esc(r.engine)})" xmlns="http://www.topografix.com/GPX/1/1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>${esc(name)}</name>
    <time>${new Date().toISOString()}</time>
  </metadata>
${wpts}
  <trk>
    <name>${esc(name)}</name>
    <type>${GPX_TYPE[st.mode]}</type>
    <trkseg>
${trkpts}
    </trkseg>
  </trk>
</gpx>
`;
}

async function saveGPX() {
  if (!st.route) return;
  const name = $("#name").value.trim() || "Percorso";
  const gpx = buildGPX(name);
  const fname = name.replace(/[^\w\-]+/g, "_") + ".gpx";
  if (window.pywebview?.api?.save_gpx) {                 // app desktop: dialogo "Salva"
    try {
      const path = await window.pywebview.api.save_gpx(fname, gpx);
      setStatus(path ? `GPX salvato in ${path}` : "Salvataggio annullato.");
    } catch (e) { setStatus(`Salvataggio non riuscito: ${e}`, "err"); }
    return;
  }
  if (touch && navigator.canShare) {                     // smartphone: foglio di condivisione
    for (const type of ["application/gpx+xml", "application/octet-stream"]) {
      const file = new File([gpx], fname, { type });
      if (!navigator.canShare({ files: [file] })) continue;
      try { await navigator.share({ files: [file], title: name }); setStatus("GPX condiviso."); return; }
      catch (e) { if (e.name === "AbortError") return; break; }
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([gpx], { type: "application/gpx+xml" }));
  a.download = fname;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setStatus("GPX scaricato.");
}

/* ---------- controlli ---------- */
function renderProfiles() {
  const sel = $("#profile");
  sel.innerHTML = PROFILES[st.mode].map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
  if (!PROFILES[st.mode].some(([v]) => v === st.profile)) st.profile = PROFILES[st.mode][0][0];
  sel.value = st.profile;
  sel.disabled = st.engine !== "brouter";
  if (!st.speedEdited) $("#loopSpeed").value = SPEED[st.mode][st.profile] ?? 18;
}
function renderTargetFields() {
  const byTime = document.querySelector("input[name=target]:checked").value === "time";
  $("#fDist").hidden = byTime; $("#fTime").hidden = !byTime; $("#fSpeed").hidden = !byTime;
}
function setDefaultName() {
  if (!st.nameEdited) $("#name").value = isLoop() ? `Anello ${MODE_NAME[st.mode]}` : `Percorso ${MODE_NAME[st.mode]}`;
}
document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", () => {
  st.mode = r.value; renderProfiles(); setDefaultName(); scheduleRoute();
}));
document.querySelectorAll("input[name=kind]").forEach(r => r.addEventListener("change", () => {
  st.kind = r.value;
  const start = st.points[0];
  st.points = isLoop() ? [start] : [start, newPt()];
  st.route = null; st.active = null;
  $("#loopBox").hidden = !isLoop(); setDefaultName(); changed();
}));
document.querySelectorAll("input[name=target]").forEach(r => r.addEventListener("change", renderTargetFields));
$("#loopSpeed").addEventListener("input", () => { st.speedEdited = true; });
$("#name").addEventListener("input", () => { st.nameEdited = true; });
$("#loopGo").addEventListener("click", () => generateLoop(false));
$("#loopAlt").addEventListener("click", () => generateLoop(true));
$("#profile").addEventListener("change", e => { st.profile = e.target.value; renderProfiles(); scheduleRoute(); });
$("#engine").addEventListener("change", e => { st.engine = e.target.value; renderProfiles(); scheduleRoute(); });
$("#add").addEventListener("click", () => {
  const p = newPt();
  if (isLoop()) st.points.push(p); else st.points.splice(st.points.length - 1, 0, p);
  st.active = p.id; map.getContainer().classList.add("picking");
  changed(); document.getElementById("in" + p.id).focus();
});
$("#swap").addEventListener("click", () => {
  st.points = isLoop() ? [st.points[0], ...st.points.slice(1).reverse()] : st.points.reverse();
  changed();
});
$("#reset").addEventListener("click", () => {
  st.points = isLoop() ? [newPt()] : [newPt(), newPt()]; st.active = null; st.route = null; st.loopBearing = null;
  map.getContainer().classList.remove("picking"); changed(); setStatus("");
});
$("#locate").addEventListener("click", () => {
  if (!navigator.geolocation) { setStatus("Questo dispositivo non fornisce la posizione.", "err"); return; }
  setStatus("Rilevo la posizione…", "busy");
  navigator.geolocation.getCurrentPosition(pos => {
    const p = st.points.find(q => q.id === st.active) || st.points[0];
    st.active = null; map.getContainer().classList.remove("picking");
    setPoint(p, pos.coords.latitude, pos.coords.longitude, null);
    map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    setStatus(`Posizione rilevata, precisione ${Math.round(pos.coords.accuracy)} m.`);
  }, err => setStatus(`Posizione non disponibile: ${err.message}`, "err"),
  { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
});
$("#dl").addEventListener("click", saveGPX);
map.on("moveend", updateVerify);
mobile.addEventListener("change", () => setTimeout(() => map.invalidateSize(), 100));

if ("serviceWorker" in navigator && location.protocol === "https:")
  navigator.serviceWorker.register("sw.js").catch(() => {});

renderProfiles(); renderTargetFields(); renderPoints();
</script>
</body>
</html>
